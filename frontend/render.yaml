services:
  # Web Service for Node.js / Express Backend & Static UI
  - type: web
    name: kenya-carbon-mrv-backend
    env: node
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mrv-postgres-db
          property: connectionString

databases:
  # Managed PostgreSQL Database Instance
  - name: mrv-postgres-db
    region: frankfurt
    plan: free
    databaseName: mrv_db
    user: mrv_user