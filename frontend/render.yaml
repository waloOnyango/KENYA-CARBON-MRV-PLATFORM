services:
  # Web Service for Node.js / Express Backend
  - type: web
    name: kenya-carbon-mrv-backend
    env: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mrv-postgres-db
          property: connectionString

databases:
  # Managed PostgreSQL Database Instance
  - name: mrv-postgres-db
    region: frankfurt
    plan: free
